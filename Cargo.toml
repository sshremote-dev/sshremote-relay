[package]
name = "sshremote-relay"
version = "1.4.0"
edition = "2024"
description = "The relay that pairs SSH Remote computers and viewers by remote access ID"
license = "MIT"
repository = "https://github.com/sshremote-dev/sshremote-relay"

[dependencies]
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
getrandom = "0.2"
hkdf = "0.12"
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
strip = true
